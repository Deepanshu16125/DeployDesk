customer_name: Kestrel Cloud
assistant_name: Kestrel Help
greeting: Ask about deploying Python APIs on Kestrel, or about our security and compliance
  posture. Answers come from the docs your team already maintains, with sources.
suggested_questions:
- How do I allow requests from a frontend on a different origin?
- How many uvicorn workers should I run in a container?
- How do I load settings from environment variables with BaseSettings?
- What are the six functions of NIST CSF 2.0?
docs_dir: data/raw
index_dir: data/index
db_path: data/deploydesk.db
embedding_model: sentence-transformers/all-MiniLM-L6-v2
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
chunk_size: 800
chunk_overlap: 150
retrieval_mode: hybrid
rerank: false
top_k: 5
context_k: 3
rrf_k: 60
min_rerank_score: -6.5  # real questions scored >= -5.6, off-topic <= -7.8 (eval + demo set)
generator: ollama
ollama_url: http://localhost:11434
ollama_model: qwen2.5-3b-local
gemini_model: gemini-1.5-flash
