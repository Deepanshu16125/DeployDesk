<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Help</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/mark.svg" alt="" class="mark">
      <div>
        <div class="brand-name" id="brandName">Kestrel Help</div>
        <div class="brand-sub" id="brandSub">Support workspace</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>New question <kbd>/</kbd></button>

    <nav class="nav" id="nav">
      <a href="#/ask" data-view="ask"><svg viewBox="0 0 20 20"><path d="M3.5 5.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-3.5 3v-3h0a2 2 0 0 1-2-2z"/></svg>Ask</a>
      <a href="#/conversations" data-view="conversations"><svg viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h7"/></svg>Conversations</a>
      <a href="#/tickets" data-view="tickets"><svg viewBox="0 0 20 20"><path d="M3.5 7V5.5h13V7a2 2 0 0 0 0 4v2.5h-13V11a2 2 0 0 0 0-4z"/><path d="M12 5.5v8" stroke-dasharray="1.5 1.8"/></svg>Tickets<span class="badge" id="ticketBadge" hidden></span></a>
      <a href="#/kb" data-view="kb"><svg viewBox="0 0 20 20"><path d="M5 3.5h7l3 3v10H5z"/><path d="M12 3.5v3h3M7.5 10h5M7.5 13h5"/></svg>Knowledge base</a>
      <a href="#/analytics" data-view="analytics"><svg viewBox="0 0 20 20"><path d="M4 16V9M8 16V5M12 16v-5M16 16V7"/></svg>Analytics</a>
      <a href="#/settings" data-view="settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg>Settings</a>
    </nav>

    <div class="recent">
      <div class="recent-head">Recent</div>
      <div id="recentList"></div>
    </div>

    <div class="status" id="status">
      <div class="status-row"><span class="dot"></span><span id="statusModel">Connecting…</span></div>
      <div class="status-sub" id="statusIndex"></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-back" id="modalBack" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
